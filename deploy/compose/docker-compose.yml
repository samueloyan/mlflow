volumes:
  pgdata:
  storage-data:

networks:
  tensorlane:
    name: tensorlane-network

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tensorlane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tensorlane}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tensorlane}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [tensorlane]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [tensorlane]

  storage:
    image: rustfs/rustfs:1.0.0-alpha.83
    environment:
      RUSTFS_ADDRESS: :9000
      RUSTFS_SERVER_DOMAINS: storage:9000
      RUSTFS_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-s3admin}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-s3admin}
      RUSTFS_CONSOLE_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", 'curl -s http://127.0.0.1:9000/health | grep -q ''"status":"ok"''']
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks: [tensorlane]

  create-bucket:
    image: amazon/aws-cli:2.33.25
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-s3admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-s3admin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_S3_ADDRESSING_STYLE: path
    entrypoint:
      - /bin/sh
      - -c
      - |
        aws --endpoint-url=http://storage:9000 s3api head-bucket --bucket ${S3_BUCKET:-tensorlane} 2>/dev/null \
          || aws --endpoint-url=http://storage:9000 s3api create-bucket --bucket ${S3_BUCKET:-tensorlane} --region ${AWS_DEFAULT_REGION:-us-east-1}
    networks: [tensorlane]
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.15.1
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER:-tensorlane}:${POSTGRES_PASSWORD:-tensorlane}@postgres:5432/mlflow
      MLFLOW_S3_ENDPOINT_URL: http://storage:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-s3admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-s3admin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      MLFLOW_S3_IGNORE_TLS: "true"
    command:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir psycopg2-binary boto3
        mlflow server \
          --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI" \
          --artifacts-destination s3://${S3_BUCKET:-tensorlane} \
          --serve-artifacts \
          --enable-workspaces \
          --static-prefix /mlflow \
          --x-frame-options SAMEORIGIN \
          --host 0.0.0.0 \
          --port 5000
    expose:
      - "5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/mlflow/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [tensorlane]

  web:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.web
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tensorlane}:${POSTGRES_PASSWORD:-tensorlane}@postgres:5432/tensorlane
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me}
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:8080}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_URL:-http://localhost:8080}
      NEXT_PUBLIC_TRACKING_URI: ${PUBLIC_URL:-http://localhost:8080}
      TENSORLANE_API_ORIGIN: http://gateway:8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks: [tensorlane]

  gateway:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.gateway
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      web:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tensorlane}:${POSTGRES_PASSWORD:-tensorlane}@postgres:5432/tensorlane
      TENSORLANE_PEPPER: ${TENSORLANE_PEPPER:-dev-pepper-change-me}
      TENSORLANE_SECRET_KEY: ${TENSORLANE_SECRET_KEY:-dev-secret-change-me}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      WEB_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      WEB_INTERNAL_URI: http://web:3000
      MLFLOW_INTERNAL_URI: http://mlflow:5000
      MLFLOW_STATIC_PREFIX: /mlflow
      ARTIFACT_ROOT: s3://${S3_BUCKET:-tensorlane}
      REDIS_URL: redis://redis:6379/0
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_GROWTH: ${STRIPE_PRICE_GROWTH:-}
      PORT: "8080"
    ports:
      - "8080:8080"
    networks: [tensorlane]

  worker:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.gateway
    command: ["tensorlane", "worker", "--interval", "2"]
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tensorlane}:${POSTGRES_PASSWORD:-tensorlane}@postgres:5432/tensorlane
      TENSORLANE_PEPPER: ${TENSORLANE_PEPPER:-dev-pepper-change-me}
      TENSORLANE_SECRET_KEY: ${TENSORLANE_SECRET_KEY:-dev-secret-change-me}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      MLFLOW_INTERNAL_URI: http://mlflow:5000
      MLFLOW_STATIC_PREFIX: /mlflow
      ARTIFACT_ROOT: s3://${S3_BUCKET:-tensorlane}
    networks: [tensorlane]
